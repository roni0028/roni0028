<style>
@keyframes g{0%{stop-color:#6d28d9}50%{stop-color:#0891b2}100%{stop-color:#6d28d9}}
@keyframes g2{0%{stop-color:#db2777}50%{stop-color:#6d28d9}100%{stop-color:#db2777}}

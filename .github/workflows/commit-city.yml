name: Commit City
on:
  schedule: [{ cron: "17 6 * * *" }]   # daily, 03:17 BRT
  workflow_dispatch:
  push: { branches: [main], paths: ["scripts/**"] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: python3 scripts/build_static.py
      - run: node scripts/skyline.mjs
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_USER: "${{ github.repository_owner }}" }
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets && git diff --cached --quiet || (git commit -m "chore: refresh Commit City [skip ci]" && git push)
